[build-system]
requires = [
    "setuptools>=42",
    "pybind11>=2.10.0"
]
build-backend = "setuptools.build_meta"


# Normal options, etc.
[tool.cibuildwheel]
skip =  ["pp*", "*-win32", "*-manylinux_i686", "*-musllinux_i686"]

build-verbosity = 1
test-requires = ["pytest", "numpy<2.0"]
test-command = "pytest {project}/tests/python_tests"
test-skip = ["*-win*"]

[tool.cibuildwheel.linux]
before-all = """
    cd libs/Phylolib && rm -f CMakeCache.txt && cmake -DCMAKE_BUILD_TYPE=Release . && make && cp libPhylolib.* ../
"""

[tool.cibuildwheel.windows]


[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
